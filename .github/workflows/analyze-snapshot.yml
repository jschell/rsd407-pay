name: Analyze retained sources
on:
  workflow_dispatch:
    inputs:
      snapshot_tag:
        description: "S-275 snapshot tag; leave blank for latest s275-source-* release"
        required: false
        default: ""
        type: string
      normalization_tag:
        description: "Normalization snapshot tag; leave blank for latest normalization-source-* release"
        required: false
        default: ""
        type: string
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Resolve immutable snapshot tags
        id: snapshots
        env:
          GH_TOKEN: "${{ github.token }}"
          REQUESTED_S275: "${{ inputs.snapshot_tag }}"
          REQUESTED_NORMALIZATION: "${{ inputs.normalization_tag }}"
        run: |
          resolve_tag() {
            requested="$1"
            prefix="$2"
            if [ -n "$requested" ]; then
              gh release view "$requested" >/dev/null
              printf "%s\n" "$requested"
            else
              tag="$(gh release list --limit 100 --json tagName,publishedAt --jq "[.[] | select(.tagName | startswith(\"$prefix\"))] | sort_by(.publishedAt) | reverse | .[0].tagName")"
              if [ -z "$tag" ] || [ "$tag" = "null" ]; then
                echo "No release found matching $prefix*" >&2
                exit 1
              fi
              printf "%s\n" "$tag"
            fi
          }
          s275="$(resolve_tag "$REQUESTED_S275" "s275-source-")"
          normalization="$(resolve_tag "$REQUESTED_NORMALIZATION" "normalization-source-")"
          echo "s275=$s275" >> "$GITHUB_OUTPUT"
          echo "normalization=$normalization" >> "$GITHUB_OUTPUT"
          echo "Resolved S-275 snapshot: $s275"
          echo "Resolved normalization snapshot: $normalization"
      - name: Download S-275 snapshot
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release download "${{ steps.snapshots.outputs.s275 }}" --pattern s275-source-snapshot.tar.gz
      - run: tar -xzf s275-source-snapshot.tar.gz
      - name: Verify S-275 snapshot hashes
        env: {PYTHONPATH: src}
        run: python -m rsd407_pay.snapshot verify
      - name: Download normalization snapshot
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release download "${{ steps.snapshots.outputs.normalization }}" --pattern normalization-source-snapshot.tar.gz
      - run: tar -xzf normalization-source-snapshot.tar.gz
      - name: Verify normalization snapshot and derivation
        env: {PYTHONPATH: src}
        run: python -m rsd407_pay.rebuild_normalization
      - name: Normalize S-275
        env: {PYTHONPATH: src}
        run: python -m rsd407_pay.pipeline
      - name: Source-field inventory
        env: {PYTHONPATH: src}
        run: python -m rsd407_pay.duty_inventory
      - name: Duty-title coverage
        env: {PYTHONPATH: src}
        run: python -m rsd407_pay.duty_coverage --vocabulary-output artifacts/normalized/duty-title-vocabulary.json
      - name: Map job families
        env: {PYTHONPATH: src}
        run: python -m rsd407_pay.job_family
      - name: Annual staffing and compensation metrics
        env: {PYTHONPATH: src}
        run: python -m rsd407_pay.metrics
      - name: Source-quality evidence
        env: {PYTHONPATH: src}
        run: python -m rsd407_pay.quality
      - name: Discover Personnel Summary reports
        continue-on-error: true
        env: {PYTHONPATH: src}
        run: python -m rsd407_pay.personnel_summary
      - name: Inventory embedded Table 47 resources
        env: {PYTHONPATH: src}
        run: python -m rsd407_pay.table47
      - name: Retain official Personnel Summary PDFs
        env: {PYTHONPATH: src}
        run: python -m rsd407_pay.table47_sources
      - name: Reconcile staff FTE against Table 45B
        env: {PYTHONPATH: src}
        run: python -m rsd407_pay.table45b_reconcile
      - name: Validation gate
        env: {PYTHONPATH: src}
        run: python -m rsd407_pay.validation
      - name: Enrollment and dual-CPI normalized metrics
        env: {PYTHONPATH: src}
        run: python -m rsd407_pay.normalize_metrics
      - name: Administrative overhead metrics
        env: {PYTHONPATH: src}
        run: python -m rsd407_pay.admin_overhead
      - name: Durable longitudinal findings
        env: {PYTHONPATH: src}
        run: python -m rsd407_pay.findings --s275-tag "${{ steps.snapshots.outputs.s275 }}" --normalization-tag "${{ steps.snapshots.outputs.normalization }}"
      - uses: actions/upload-artifact@v4
        with:
          name: retained-analysis-${{ steps.snapshots.outputs.s275 }}-${{ steps.snapshots.outputs.normalization }}
          path: |
            artifacts/normalized/
            artifacts/reconciliation/
          if-no-files-found: error
          retention-days: 30
