name: Analyze S-275 snapshot
on:
  workflow_dispatch:
    inputs:
      snapshot_tag:
        description: "Existing immutable source release tag"
        required: true
        type: string
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Download source snapshot
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release download "${{ inputs.snapshot_tag }}" --pattern s275-source-snapshot.tar.gz
      - run: tar -xzf s275-source-snapshot.tar.gz
      - name: Verify snapshot hashes
        env: {PYTHONPATH: src}
        run: python -m rsd407_pay.snapshot verify
      - name: Normalize
        env: {PYTHONPATH: src}
        run: python -m rsd407_pay.pipeline
      - name: Source-field inventory
        env: {PYTHONPATH: src}
        run: python -m rsd407_pay.duty_inventory
      - name: Duty-title coverage
        env: {PYTHONPATH: src}
        run: python -m rsd407_pay.duty_coverage --vocabulary-output artifacts/normalized/duty-title-vocabulary.json
      - name: Map job families
        env: {PYTHONPATH: src}
        run: python -m rsd407_pay.job_family
      - uses: actions/upload-artifact@v4
        with:
          name: s275-analysis-${{ inputs.snapshot_tag }}
          path: artifacts/normalized/
          if-no-files-found: error
          retention-days: 30
