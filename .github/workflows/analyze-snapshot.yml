name: Analyze retained sources
on:
  workflow_dispatch:
    inputs:
      snapshot_tag:
        description: "Existing immutable S-275 source release tag"
        required: true
        type: string
      normalization_tag:
        description: "Existing immutable normalization source release tag"
        required: true
        type: string
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Download S-275 snapshot
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release download "${{ inputs.snapshot_tag }}" --pattern s275-source-snapshot.tar.gz
      - run: tar -xzf s275-source-snapshot.tar.gz
      - name: Verify S-275 snapshot hashes
        env: {PYTHONPATH: src}
        run: python -m rsd407_pay.snapshot verify
      - name: Download normalization snapshot
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release download "${{ inputs.normalization_tag }}" --pattern normalization-source-snapshot.tar.gz
      - run: tar -xzf normalization-source-snapshot.tar.gz
      - name: Verify normalization snapshot and derivation
        env: {PYTHONPATH: src}
        run: python -m rsd407_pay.rebuild_normalization
      - name: Normalize S-275
        env: {PYTHONPATH: src}
        run: python -m rsd407_pay.pipeline
      - name: Source-field inventory
        env: {PYTHONPATH: src}
        run: python -m rsd407_pay.duty_inventory
      - name: Duty-title coverage
        env: {PYTHONPATH: src}
        run: python -m rsd407_pay.duty_coverage --vocabulary-output artifacts/normalized/duty-title-vocabulary.json
      - name: Map job families
        env: {PYTHONPATH: src}
        run: python -m rsd407_pay.job_family
      - name: Annual staffing and compensation metrics
        env: {PYTHONPATH: src}
        run: python -m rsd407_pay.metrics
      - name: Source-quality evidence
        env: {PYTHONPATH: src}
        run: python -m rsd407_pay.quality
      - name: Enrollment and dual-CPI normalized metrics
        env: {PYTHONPATH: src}
        run: python -m rsd407_pay.normalize_metrics
      - name: Administrative overhead metrics
        env: {PYTHONPATH: src}
        run: python -m rsd407_pay.admin_overhead
      - uses: actions/upload-artifact@v4
        with:
          name: retained-analysis-${{ inputs.snapshot_tag }}-${{ inputs.normalization_tag }}
          path: artifacts/normalized/
          if-no-files-found: error
          retention-days: 30
