name: S-275 source check
on:
  workflow_dispatch:
  schedule:
    - cron: "17 14 * * 1"
  pull_request:
    paths:
      - "config/sources.json"
      - "src/rsd407_pay/sources.py"
      - "src/rsd407_pay/source_revisions.py"
      - "tests/test_source_revisions.py"
      - "src/rsd407_pay/final_source_watch.py"
      - "tests/test_final_source_watch.py"
      - "src/rsd407_pay/workbook.py"
      - "requirements.txt"
      - "tests/test_sources.py"
      - "tests/test_workbook.py"
      - ".github/workflows/source-check.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Discover expected OSPI S-275 sources
        env:
          PYTHONPATH: src
        run: python -m rsd407_pay.sources
      - name: Watch for newly final personnel workbook candidates
        if: always()
        env:
          PYTHONPATH: src
        run: python -m rsd407_pay.final_source_watch
      - name: Retrieve explicitly accepted source manifest
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/manifests
          tag="$(python -c 'import json; print(json.load(open("config/sources.json"))["accepted_snapshot_tag"])')"
          gh release download "$tag" --pattern collection.json --dir artifacts/manifests
          mv artifacts/manifests/collection.json artifacts/manifests/accepted-collection.json
      - name: Compare every accepted source against current workbook bytes
        if: always()
        env:
          PYTHONPATH: src
        run: python -m rsd407_pay.source_revisions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s275-source-status
          path: |
            artifacts/source-status.json
            artifacts/final-source-watch.json
            artifacts/s275-source-page.html
            artifacts/manifests/accepted-collection.json
            artifacts/source-revisions.json
            artifacts/source-revisions/
          if-no-files-found: warn
