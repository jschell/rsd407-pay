name: Inventory personnel summary reports
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Discover OSPI personnel summary resources
        env: {PYTHONPATH: src}
        run: python -m rsd407_pay.personnel_summary
      - name: Inventory Table 47 controls
        if: always()
        env: {PYTHONPATH: src}
        run: |
          if [ -f artifacts/reconciliation/personnel-summary-inventory.json ]; then
            python -m rsd407_pay.table47
          fi
      - name: Retain Table 47 source PDFs
        if: always()
        env: {PYTHONPATH: src}
        run: |
          if [ -f artifacts/reconciliation/table47-control-inventory.json ]; then
            python -m rsd407_pay.table47_sources
          fi
      - name: Inventory personnel control tables
        if: always()
        env: {PYTHONPATH: src}
        run: |
          if [ -f artifacts/reconciliation/table47-source-manifest.json ]; then
            python -m rsd407_pay.personnel_tables
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: personnel-summary-reconciliation-sources
          path: artifacts/reconciliation/
          if-no-files-found: error
