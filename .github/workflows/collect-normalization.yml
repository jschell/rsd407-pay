name: Collect normalization sources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Collect BLS CPI series
        env: {PYTHONPATH: src}
        run: python -m rsd407_pay.cpi
      - name: Inventory OSPI P-223 final enrollment workbook
        env: {PYTHONPATH: src}
        run: python -m rsd407_pay.enrollment_inventory
      - uses: actions/upload-artifact@v4
        with:
          name: normalization-sources
          path: artifacts/normalization/
          if-no-files-found: error
          retention-days: 30
