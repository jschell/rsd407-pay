name: Publish normalization source snapshot
on:
  workflow_dispatch:
    inputs:
      snapshot_tag:
        description: "Immutable release tag, e.g. normalization-source-2026-10-04"
        required: true
        type: string
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Test
        env: {PYTHONPATH: src}
        run: python -m unittest discover -s tests -v
      - name: Collect BLS CPI source responses
        env: {PYTHONPATH: src}
        run: python -m rsd407_pay.cpi
      - name: Inventory OSPI P-223 workbook
        env: {PYTHONPATH: src}
        run: python -m rsd407_pay.enrollment_inventory
      - name: Extract and retain OSPI P-223 enrollment
        env: {PYTHONPATH: src}
        run: python -m rsd407_pay.enrollment
      - name: Build and verify manifest
        env: {PYTHONPATH: src}
        run: |
          python -m rsd407_pay.normalization_snapshot --tag "${{ inputs.snapshot_tag }}"
          python -m rsd407_pay.normalization_snapshot --verify
      - name: Build immutable archive
        run: tar -czf normalization-source-snapshot.tar.gz artifacts/normalization
      - name: Refuse replacement
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          if gh release view "${{ inputs.snapshot_tag }}" >/dev/null 2>&1; then
            echo "Release tag already exists; snapshots are immutable" >&2
            exit 1
          fi
      - name: Publish release
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release create "${{ inputs.snapshot_tag }}" normalization-source-snapshot.tar.gz artifacts/normalization/normalization-source-manifest.json --title "${{ inputs.snapshot_tag }}" --notes "Immutable validated OSPI P-223 and BLS CPI normalization-source snapshot. Do not replace; publish a new tag when upstream inputs change."
